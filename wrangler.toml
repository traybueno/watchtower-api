name = "watchtower-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV for edge caching (subdomain lookups, API key cache)
[[kv_namespaces]]
binding = "SAVES"
id = "ace14130d77a43879e2eb3a5c20ac9d0"

# R2 for game file storage
[[r2_buckets]]
binding = "GAMES"
bucket_name = "watchtower-games"

# Durable Objects for multiplayer rooms
[durable_objects]
bindings = [
  { name = "SIMPLE_ROOMS", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SyncRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Room"]

# Migration to delete old classes
[[migrations]]
tag = "v4"
deleted_classes = ["GameRoom", "SyncRoom"]

[vars]
ENVIRONMENT = "production"
# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are set via wrangler secret
